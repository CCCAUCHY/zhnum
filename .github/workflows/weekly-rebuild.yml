name: 周构建（Unihan 更新检查 + 三档重建）

on:
  schedule:
    - cron: '23 4 * * 1'   # 每周一 04:23 UTC (避开整点)
  workflow_dispatch:        # 手动触发

permissions:
  contents: write           # 数据更新时提交三档产物

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 确保 localedef 与 locale 数据源可用
        run: |
          if ! command -v localedef >/dev/null 2>&1 \
             || [ ! -f /usr/share/i18n/locales/iso14651_t1_common ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq locales
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 拉取最新 Unihan 数据
        run: |
          # 退出码: 0 = 有更新, 2 = 无变化, 其他 = 失败
          set +e
          python3 update-unihan.py .
          rc=$?
          set -e
          if [ "$rc" -gt 2 ]; then
            echo "::error::update-unihan.py 异常退出 ($rc)"
            exit 1
          fi
          echo "UPDATED=$rc" >> "$GITHUB_ENV"
          if [ "$rc" -eq 0 ]; then echo "Unihan: 有更新, 本次将提交重建产物"; else echo "Unihan: 无变化"; fi

      - name: 重建三档 locale 源
        run: |
          mkdir -p out/亿 out/万亿 out/亿亿
          python3 gen_zhnum.py 100000000         out/亿
          python3 gen_zhnum.py 1000000000000     out/万亿
          python3 gen_zhnum.py 10000000000000000 out/亿亿

      - name: 编译 + verify（全绿才继续）
        run: |
          set -e
          for t in 亿 万亿 亿亿; do
            mkdir -p out/$t/loc
            (cd out/$t \
             && localedef -i zhbase -f UTF-8 ./loc/zhbase.UTF-8 \
             && localedef -i zhnum  -f UTF-8 ./loc/zhnum.UTF-8)
            LC_ALL=zhnum.UTF-8 LOCPATH="$PWD/out/$t/loc" \
              python3 verify.py | tail -1 | grep -q '全部通过' \
              || { echo "::error::$t 档 verify 未全绿"; exit 1; }
            echo "$t: verify 全部通过"
          done

      - name: 同步产物到 tiers/
        run: |
          for t in 亿 万亿 亿亿; do
            cp out/$t/zhnum out/$t/zhbase tiers/$t/
          done

      - name: 数据有更新时提交
        if: env.UPDATED == '0'
        run: |
          git config user.name  "zhnum-bot"
          git config user.email "actions@github.com"
          git add unihan-*.tsv tiers/
          if git diff --cached --quiet; then
            echo "产物无实质变化, 跳过提交"
          else
            git commit -m "周构建: Unihan 数据更新 → 三档重建 ($(date -u +%F))"
            git push origin HEAD:main
          fi

      - name: 上传三档产物 (artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: zhnum-tiers-${{ github.run_number }}
          path: |
            out/亿/zhnum
            out/亿/zhbase
            out/万亿/zhnum
            out/万亿/zhbase
            out/亿亿/zhnum
            out/亿亿/zhbase
          retention-days: 90
