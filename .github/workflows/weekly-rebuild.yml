name: 周构建（Unihan 更新检查 + 六份重建）

on:
  schedule:
    - cron: '23 4 * * 1'   # 每周一 04:23 UTC (避开整点)
  workflow_dispatch:        # 手动触发

# 权限按 job 给, 不在此处给全局 write:
#   build  —— 只读。它要下载并解压外部数据 (Unihan.zip), 是与不可信输入打交道的
#             那一步, 不该同时持有写权限、也不该让 GITHUB_TOKEN 落在 .git/config。
#   commit —— 只在数据确有更新时运行, 不接触外部输入, 才给 contents: write。
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CHARMAP: ${{ github.workspace }}/charmaps/UTF-8
    outputs:
      updated: ${{ steps.unihan.outputs.updated }}
    steps:
      # actions 一律钉到 commit SHA: tag 可被重新指向, SHA 不会。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false   # 不把 token 写进 .git/config

      - name: 确保 localedef 与 locale 数据源可用
        run: |
          if ! command -v localedef >/dev/null 2>&1 \
             || [ ! -f /usr/share/i18n/locales/iso14651_t1_common ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq locales
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: 拉取最新 Unihan 数据
        id: unihan
        run: |
          # 退出码: 0 = 有更新, 2 = 无变化, 其他 = 失败
          set +e
          python3 update-unihan.py .
          rc=$?
          set -e
          if [ "$rc" -gt 2 ]; then
            echo "::error::update-unihan.py 异常退出 ($rc)"
            exit 1
          fi
          echo "updated=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 0 ]; then echo "Unihan: 有更新, 本次将提交重建产物"; else echo "Unihan: 无变化"; fi

      - name: 生成补齐版 charmap
        run: |
          # glibc 的 UTF-8 charmap 漏收 U+FA6E/FA6F/U+FADA..FAFF 等兼容汉字,
          # 缺了它们 localedef 会静默丢弃对应 locale 行 ⇒ 这些字回落排到最前
          python3 gen-charmap.py charmaps

      - name: 重建六份 locale 源（三档 × 两版本）
        run: |
          for pair in "100000000 亿" "1000000000000 万亿" "10000000000000000 亿亿"; do
            set -- $pair
            for v in pure mixed; do
              mkdir -p "out/$2-$v"
              python3 gen_zhnum.py "$1" "out/$2-$v" "$v"
            done
          done

      - name: 编译 + verify（全绿才继续）
        run: |
          set -e
          for t in 亿 万亿 亿亿; do
            for v in pure mixed; do
              mkdir -p "out/$t-$v/loc"
              (cd "out/$t-$v" \
               && localedef -f "$CHARMAP" -i "$PWD/zhbase" ./loc/zhbase.UTF-8 \
               && localedef -f "$CHARMAP" -i "$PWD/zhnum"  ./loc/zhnum.UTF-8)
              LC_ALL=zhnum.UTF-8 LOCPATH="$PWD/out/$t-$v/loc" \
                python3 verify.py | tail -1 | grep -q '全部通过' \
                || { echo "::error::$t/$v verify 未全绿"; exit 1; }
              echo "$t/$v: verify 全部通过"
            done
          done

      - name: 同步产物到 tiers/（超 100MB 的压 zip）
        run: ./pack_tiers.sh

      - name: 上传六份产物 (artifacts)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: zhnum-build
          # 入库形态 (超 100MB 的已压 zip) + 数据表 —— 提交 job 直接拿这份,
          # 不必再跑一次构建
          path: |
            tiers/
            unihan-*.tsv
          retention-days: 90

  commit:
    needs: build
    # 数据有更新时才提交; 手动触发也走一遍 (产物无实质变化则内部自动跳过) ——
    # 这样构建→artifact→提交这条交接链路随时可验证, 不必等 Unihan 真的更新。
    if: needs.build.outputs.updated == '0' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write           # 只有这个 job 需要写
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: zhnum-build
          path: .

      - name: 提交重建产物
        run: |
          git config user.name  "zhnum-bot"
          git config user.email "actions@github.com"
          git add unihan-*.tsv tiers/
          if git diff --cached --quiet; then
            echo "产物无实质变化, 跳过提交"
          else
            git commit -m "周构建: 重建产物 ($(date -u +%F))"
            git push origin HEAD:main
          fi
